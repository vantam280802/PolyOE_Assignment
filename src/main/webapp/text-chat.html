<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat - Websockets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============ DESIGN TOKENS (đồng bộ hệ thống) ============ */
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --accent: #EC4899;

            --bg-gradient: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 45%, #fdf2f8 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(255, 255, 255, 0.6);

            --text-main: #1f2937;
            --text-muted: #6b7280;
            --text-faint: #9ca3af;

            --border: #e5e7eb;

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;

            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.03);

            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 460px;
            padding: 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
        }

        h2 {
            text-align: center;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 22px;
        }

        /* ============ KHUNG TIN NHẮN ============ */
        #messages {
            height: 340px;
            width: 100%;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 14px;
            background-color: #f8fafc;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 999px;
        }

        #messages p {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 9px 14px;
            border-radius: 14px 14px 14px 4px;
            font-size: 14.5px;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            word-wrap: break-word;
            margin-bottom: 10px;
            max-width: 88%;
            list-style: none;
        }

        #messages p:last-child {
            margin-bottom: 0;
        }

        #messages:empty::before {
            content: "Chưa có tin nhắn nào. Hãy bắt đầu trò chuyện!";
            display: block;
            text-align: center;
            color: var(--text-faint);
            font-style: italic;
            font-size: 13.5px;
            padding-top: 130px;
        }

        /* ============ Ô NHẬP TIN NHẮN ============ */
        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.25s var(--ease);
        }

        .input-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .input-row button {
            padding: 12px 22px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(to right, var(--primary), #6366f1);
            box-shadow: var(--shadow-sm);
            transition: all 0.25s var(--ease);
            white-space: nowrap;
        }

        .input-row button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px 18px;
            }
            #messages {
                height: 280px;
            }
        }
    </style>
</head>
<body onload="init()">
    <div class="container">
        <h2>Phòng Chat Cộng Đồng</h2>
        <p class="subtitle">Text mode · Websocket</p>

        <!-- Vùng hiển thị tin nhắn -->
        <div id="messages"></div>

        <!-- Vùng nhập tin nhắn -->
        <div class="input-row">
            <input type="text" id="message" placeholder="Nhập tin nhắn...">
            <button onclick="send()">Send</button>
        </div>
    </div>

    <script>
        var websocket = null;

        function init() {
            // Thay "PolyOE_Project" bằng đúng tên context path dự án của bạn nếu khác
            var wsUri = "ws://" + document.location.host + "/PolyOE_Project/text/chat";
            websocket = new WebSocket(wsUri);

            websocket.onopen = function(resp) {
                console.log("onopen", resp);
            };

            websocket.onmessage = function(resp) {
                var message = resp.data;
                var html = document.getElementById('messages').innerHTML;
                document.getElementById('messages').innerHTML = html + '<p>' + message + '</p>';
                // Tự động cuộn xuống cuối
                var msgDiv = document.getElementById('messages');
                msgDiv.scrollTop = msgDiv.scrollHeight;
            };

            websocket.onerror = function(resp) {
                alert('An error occurred, closing application');
                console.log("onerror", resp);
            };

            websocket.close = function(resp) {
                alert(resp.reason || 'Goodbye');
                console.log("onclose", resp);
            };
        }

        function send() {
            var messageInput = document.getElementById("message");
            if (messageInput.value.trim() !== "") {
                websocket.send(messageInput.value);
                messageInput.value = ""; // Xóa form sau khi gửi
            }
        }
    </script>
</body>
</html>
